name: Update Google Scholar citations

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/google_scholar_crawler.yaml
      - google_scholar_crawler/**
  schedule:
    # 16:05 Asia/Shanghai every day (GitHub Actions cron uses UTC).
    - cron: "5 8 * * *"

permissions:
  contents: write

concurrency:
  group: google-scholar-crawler
  cancel-in-progress: true

jobs:
  update-citations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOOGLE_SCHOLAR_ID: _1fbIXsAAAAJ
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt

      - name: Install crawler
        run: python -m pip install -r google_scholar_crawler/requirements.txt

      - name: Fetch citation data
        working-directory: google_scholar_crawler
        run: timeout --signal=TERM 5m python main.py

      - name: Publish citation data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          publish_dir="$(mktemp -d)"
          cp google_scholar_crawler/results/*.json "$publish_dir/"
          cd "$publish_dir"
          git init --initial-branch=google-scholar-stats
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update Google Scholar citation data"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin google-scholar-stats --force
